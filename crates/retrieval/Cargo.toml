[package]
name = "retrieval"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Dual-scope retrieval pipeline for dynamic agent skill layer"

[dependencies]
arc-swap = "1.7.1"
async-trait = "0.1.89"
domain = { path = "../domain" }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
