[package]
name = "admin"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Admin MCP tools for graph inspection and manual rebuild triggers"

[features]
test-utils = []

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["clock"] }
domain = { path = "../domain" }
graph-builder = { path = "../graph-builder" }
infrastructure = { path = "../infrastructure" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt", "sync"] }
