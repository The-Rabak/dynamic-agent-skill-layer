[package]
name = "infrastructure"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Concrete infrastructure adapters for the dynamic agent skill layer"

[dependencies]
async-trait = "0.1.89"
blake3 = "1.8.2"
chrono = { version = "0.4.42", features = ["clock", "serde"] }
domain = { path = "../domain" }
redis = { version = "0.32.7", features = ["aio", "tokio-comp"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["process", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
