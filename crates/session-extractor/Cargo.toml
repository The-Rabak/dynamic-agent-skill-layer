[package]
name = "session-extractor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Session-end transcript extraction and pending draft generation"

[features]
test-utils = []

[dependencies]
async-channel = "2.5.0"
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["clock"] }
domain = { path = "../domain" }
infrastructure = { path = "../infrastructure" }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.18.1", features = ["v7"] }

[[test]]
name = "test_orchestrated_extraction_live"
path = "../../tests/e2e/test_orchestrated_extraction_live.rs"
required-features = ["test-utils"]
