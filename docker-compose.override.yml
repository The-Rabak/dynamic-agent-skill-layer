services:
  ollama:
    # NVIDIA GPU passthrough (RTX/GeForce). Requires the NVIDIA Container Toolkit
    # on the host (the `nvidia` docker runtime). Ollama auto-detects CUDA.
    # NOTE: NVIDIA-only. macOS/Metal has no Docker GPU passthrough — on a Mac,
    # run Ollama natively to use Metal (or drop this block on non-NVIDIA hosts).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}

  mcp-server:
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      POSTGRES_URL: postgres://${POSTGRES_USER:-skill_layer}:${POSTGRES_PASSWORD:-skill_layer}@postgres:5432/${POSTGRES_DB:-skill_layer}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434

  graph-builder:
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      POSTGRES_URL: postgres://${POSTGRES_USER:-skill_layer}:${POSTGRES_PASSWORD:-skill_layer}@postgres:5432/${POSTGRES_DB:-skill_layer}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
