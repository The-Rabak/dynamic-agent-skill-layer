services:
  postgres:
    image: postgres:18.4-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-skill-layer}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skill_layer}
      POSTGRES_USER: ${POSTGRES_USER:-skill_layer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skill_layer}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      # postgres:18 uses PGDATA=/var/lib/postgresql/18/docker and declares
      # VOLUME /var/lib/postgresql. Mounting the named volume at the legacy
      # /var/lib/postgresql/data left PGDATA in a per-container ANONYMOUS volume
      # that was orphaned (corpus appeared to vanish) whenever the container was
      # recreated. Mount the named volume at the real PGDATA parent so the cluster
      # persists across recreates.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.6.3-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-skill-layer}-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: ${COMPOSE_PROJECT_NAME:-skill-layer}-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-16333}:6333"
      - "${QDRANT_GRPC_PORT:-16334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image ships neither wget nor curl (only bash + the qdrant
      # binary), so the old `wget http://localhost:6333/collections` probe could
      # never run → the container reported unhealthy despite a fully serving
      # server. bash's /dev/tcp talks to the readiness endpoint with no extra
      # tooling; `/readyz` returns HTTP 200 once qdrant is ready to serve.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: ${COMPOSE_PROJECT_NAME:-skill-layer}-ollama
    environment:
      # Parallel request slots so concurrent compile_context embed calls are served
      # in parallel rather than serialized — keeps the warm read path p95 under the
      # 500ms SLA under concurrent sessions (DS-007). Pair with EMBED_MAX_CONCURRENCY
      # on the clients.
      # Default embedding arm is qwen3-embedding:4b (2560-dim). Operators must
      # pre-pull it before starting the stack:
      #   docker run --rm -v ollama_data:/root/.ollama ollama/ollama pull qwen3-embedding:4b
      # The extra loaded copies of the model are cheap relative to the serving benefit.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
      # Keep every model resident for 24h after last use. We impose NO request
      # timeouts on model calls (a slow cold load must never cut a call off), so
      # keeping models warm is how latency stays sane — a cold reload after idle
      # would otherwise block the first call unboundedly. Override via OLLAMA_KEEP_ALIVE
      # (e.g. "-1" for indefinite, "30m" on a shared box where holding VRAM 24/7 is costly).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
    # NVIDIA GPU passthrough (RTX/GeForce). Requires the NVIDIA Container Toolkit
    # on the host (the `nvidia` docker runtime). Ollama auto-detects CUDA.
    # NOTE: NVIDIA-only. macOS/Metal has no Docker GPU passthrough — on a Mac,
    # run Ollama natively to use Metal (or drop this block on non-NVIDIA hosts).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${OLLAMA_PORT:-11444}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # The ollama/ollama image ships neither wget nor curl — only the `ollama`
      # binary. `ollama ps` returns 0 once the server is serving, so it is the
      # correct in-image liveness probe (the old wget probe always failed → the
      # container reported unhealthy despite a healthy server).
      test: ["CMD", "ollama", "ps"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BIN: mcp-server
    image: skill-layer/mcp-server:latest
    container_name: ${COMPOSE_PROJECT_NAME:-skill-layer}-mcp-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    # Network exposure contract (constitution §Deferred-risk guard):
    # - Container-internal binding uses 0.0.0.0 (required for Docker health checks:
    #   wget localhost:3001/health inside container).
    # - Host-side port mapping restricted to 127.0.0.1. MCP control plane (including
    #   mutating/admin tools) is not callable from remote network surfaces.
    # - Docker inter-service traffic (graph-builder -> postgres, etc.) uses internal
    #   Docker DNS names and is unaffected by the host mapping.
    # - Auth is deferred per current-phase policy; surface restriction is the primary guard.
    ports:
      - "127.0.0.1:${MCP_SERVER_PORT:-3001}:3001"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      MCP_SERVER_ADDR: 0.0.0.0:3001
      DATABASE_URL: postgres://${POSTGRES_USER:-skill_layer}:${POSTGRES_PASSWORD:-skill_layer}@postgres:5432/${POSTGRES_DB:-skill_layer}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      # Embedding arm selection. Defaults preserve production: Ollama + qwen3:4b.
      # The embedding-model/server A/B (T12 latency experiment) flips these:
      #   EMBEDDING_PROVIDER=tei, TEI_URL=http://tei:80, OLLAMA_EMBED_MODEL=<arm label>
      # OLLAMA_EMBED_MODEL is the arm identity for the model-keyed collection + /health
      # (under TEI set it to e.g. qwen3-embedding-4b-tei to isolate that arm's vectors).
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      TEI_URL: ${TEI_URL:-http://tei:80}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-qwen3-embedding:4b}
      TEI_CLIENT_BATCH_SIZE: ${TEI_CLIENT_BATCH_SIZE:-32}
      # Retrieval/priming knobs surfaced for the T12 latency curve (explicit prod
      # defaults: snapshot_dense backend, multi-view priming at 8 segments).
      RETRIEVAL_BACKEND: ${RETRIEVAL_BACKEND:-snapshot_dense}
      RETRIEVAL_PRIMING_MAX_SEGMENTS: ${RETRIEVAL_PRIMING_MAX_SEGMENTS:-8}
      SKILL_GLOBAL_PATHS: /skills/global
      SKILL_GLOBAL_ALLOWED_ROOTS: ${SKILL_GLOBAL_ALLOWED_ROOTS:-/skills/project,/skills/global}
      # Declares the in-container project scope root (issue #154). The container's
      # working directory is `/` with no `.git`/marker, so without this the project
      # resolver returns ResolverUnavailable and compile_context degrades for EVERY
      # query. Pointing it at the mounted project skills root makes
      # FsMarkerProjectResolver resolve project scope directly; project-scoped skills
      # (whose source_paths live under /skills/project) then match.
      SKILL_PROJECT_ROOT: ${SKILL_PROJECT_ROOT:-/skills/project}
      GRAPH_BUILDER_PROJECT_ROOT: ${GRAPH_BUILDER_PROJECT_ROOT:-/skills/project}
      CLAUDE_TRANSCRIPT_ROOT: ${CLAUDE_TRANSCRIPT_ROOT:-/transcripts}
      # Extraction provider for the extract_session worker pool. Ollama is the
      # default local path (no cloud key).
      # - =claude or =claude-api: Anthropic Messages API; requires ANTHROPIC_API_KEY
      #   (loud startup error if key absent). Not available as =claude-code here —
      #   the CLI provider is host-only and must not be set in this container config.
      # - =claude-code / =claude-cli: host-only CLI subprocess; NOT available in the
      #   stock container (no claude binary, no login). Use on bare-host deployments only.
      EXTRACT_SESSION_PROVIDER: ${EXTRACT_SESSION_PROVIDER:-ollama}
      # Shared secret for the localhost /ingest/transcript endpoint (todo 103/099).
      # When set, host capture hooks must send a matching X-Ingest-Secret header.
      # When empty, the endpoint relies on the 127.0.0.1 port binding alone.
      TRANSCRIPT_INGEST_SECRET: ${TRANSCRIPT_INGEST_SECRET:-}
    volumes:
      - ${GRAPH_BUILDER_PROJECT_ROOT:-.}:/skills/project:ro
      - ${SKILL_GLOBAL_HOST_PATH:-${HOME}/.claude/skills}:/skills/global
      - ${CLAUDE_TRANSCRIPT_ROOT:-./tests/fixtures}:/transcripts:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  graph-builder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BIN: graph-builder
    image: skill-layer/graph-builder:latest
    container_name: ${COMPOSE_PROJECT_NAME:-skill-layer}-graph-builder
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-skill_layer}:${POSTGRES_PASSWORD:-skill_layer}@postgres:5432/${POSTGRES_DB:-skill_layer}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      # Embedding arm selection (see mcp-server). graph-builder must embed the
      # corpus with the SAME provider/arm as mcp-server or vectors would mismatch.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      TEI_URL: ${TEI_URL:-http://tei:80}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-qwen3-embedding:4b}
      TEI_CLIENT_BATCH_SIZE: ${TEI_CLIENT_BATCH_SIZE:-32}
      GRAPH_BUILDER_PROJECT_ROOT: ${GRAPH_BUILDER_PROJECT_ROOT:-/skills/project}
      GRAPH_BUILDER_GLOBAL_ROOT: ${GRAPH_BUILDER_GLOBAL_ROOT:-/skills/global}
      GRAPH_BUILDER_ADDR: 0.0.0.0:${GRAPH_BUILDER_PORT:-8080}
    volumes:
      - ${GRAPH_BUILDER_PROJECT_ROOT:-.}:/skills/project:ro
      - ${SKILL_GLOBAL_HOST_PATH:-${HOME}/.claude/skills}:/skills/global
    # Graph-builder port also bound to localhost-only (same exposure contract as mcp-server).
    ports:
      - "127.0.0.1:${GRAPH_BUILDER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  maintenance-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BIN: maintenance-worker
    image: skill-layer/maintenance-worker:latest
    container_name: ${COMPOSE_PROJECT_NAME:-skill-layer}-maintenance-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-skill_layer}:${POSTGRES_PASSWORD:-skill_layer}@postgres:5432/${POSTGRES_DB:-skill_layer}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      # Embedding arm selection (see mcp-server). Maintenance embeds merge/dedup
      # candidates and must use the SAME provider/arm as the live corpus.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      TEI_URL: ${TEI_URL:-http://tei:80}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-qwen3-embedding:4b}
      TEI_CLIENT_BATCH_SIZE: ${TEI_CLIENT_BATCH_SIZE:-32}
      # Transcript-ingest queue drain (todo 103). The drain feeds queued content
      # via transcript_inline, so CLAUDE_TRANSCRIPT_ROOT is never read for IO —
      # it is required only by SessionExtractor::from_environment's construction
      # contract. SKILL_GLOBAL_* + the writable project mount let the drain emit
      # .pending drafts. Set MAINTENANCE_TRANSCRIPT_DRAIN=off to roll back.
      CLAUDE_TRANSCRIPT_ROOT: /skills/global
      SKILL_GLOBAL_PATHS: /skills/global
      SKILL_GLOBAL_ALLOWED_ROOTS: ${SKILL_GLOBAL_ALLOWED_ROOTS:-/skills/project,/skills/global}
      GRAPH_BUILDER_PROJECT_ROOT: ${GRAPH_BUILDER_PROJECT_ROOT:-/skills/project}
      EXTRACT_SESSION_PROVIDER: ${EXTRACT_SESSION_PROVIDER:-ollama}
    volumes:
      # Writable (not :ro): the drain writes .pending drafts into <repo>/.skills.
      - ${GRAPH_BUILDER_PROJECT_ROOT:-.}:/skills/project
      - ${SKILL_GLOBAL_HOST_PATH:-${HOME}/.claude/skills}:/skills/global
    restart: unless-stopped

  # HuggingFace Text Embeddings Inference — the alternative embedding server for
  # the T12 embedding-model/server A/B (arms A1 = 4b/TEI, A3 = 0.6b/TEI). Gated
  # behind the `tei` compose profile so the default production stack never starts
  # it (and never reserves the GPU for it). Bring it up only for an experiment arm:
  #   TEI_MODEL_ID=Qwen/Qwen3-Embedding-0.6B docker compose --profile tei up -d tei
  # Then restart mcp-server/graph-builder with EMBEDDING_PROVIDER=tei + TEI_URL.
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9
    container_name: ${COMPOSE_PROJECT_NAME:-skill-layer}-tei
    profiles: ["tei"]
    # Qwen3-Embedding uses last-token pooling; match it explicitly. No instruction
    # prompt is configured (the client sends raw text — parity with the Ollama arm).
    command:
      - "--model-id"
      - "${TEI_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}"
      - "--pooling"
      - "last-token"
      - "--max-client-batch-size"
      - "${TEI_MAX_CLIENT_BATCH_SIZE:-64}"
      - "--max-batch-tokens"
      - "${TEI_MAX_BATCH_TOKENS:-32768}"
    environment:
      # Optional HF token for gated/rate-limited model pulls (Qwen3-Embedding is public).
      HF_TOKEN: ${HF_TOKEN:-}
      # Flash-attention kernels produce NaN embeddings on pre-Ampere GPUs (the host
      # RTX 2060 is Turing, compute 7.5). Default OFF here so the experiment host
      # gets correct vectors; set USE_FLASH_ATTENTION=true on an Ampere+ card.
      USE_FLASH_ATTENTION: ${USE_FLASH_ATTENTION:-false}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:${TEI_PORT:-8085}:80"
    volumes:
      - tei_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  tei_data:
  ollama_data:
    external: true
