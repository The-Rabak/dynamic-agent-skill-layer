services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skill_layer_test}
      POSTGRES_USER: ${POSTGRES_USER:-skill_layer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skill_layer}
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.6.3-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "16333:6333"
      - "16334:6334"

  ollama:
    image: ollama/ollama:0.24.0
    ports:
      - "11444:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  topology-check:
    image: alpine:3.23.4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    command:
      - sh
      - -c
      - |
        nc -z postgres 5432
        nc -z redis 6379
        nc -z qdrant 6333
        nc -z ollama 11434
        echo "test topology reachable"

  ollama-model-check:
    image: alpine:3.23.4
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        echo "==> Checking nomic-embed-text model availability"
        MODEL_PRESENT=$$(curl -s http://ollama:11434/api/tags | grep -c '"name":"nomic-embed-text"')
        if [ "$$MODEL_PRESENT" -eq 0 ]; then
          echo "nomic-embed-text not found, pulling..."
          curl -s http://ollama:11434/api/pull -d '{"name":"nomic-embed-text"}' >/dev/null
          echo "nomic-embed-text pull completed"
        else
          echo "nomic-embed-text already present"
        fi

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BIN: mcp-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      RUST_LOG: debug
      DATABASE_URL: postgres://skill_layer:skill_layer@postgres:5432/skill_layer_test
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6334
      OLLAMA_URL: http://ollama:11434
      MCP_SERVER_ADDR: 0.0.0.0:3001
      SKILL_GLOBAL_PATHS: /skills/global
      SKILL_GLOBAL_ALLOWED_ROOTS: /skills/global
    volumes:
      - test-global-skills:/skills/global:ro
      - test-transcripts:/transcripts:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  graph-builder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BIN: graph-builder
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    environment:
      RUST_LOG: debug
      DATABASE_URL: postgres://skill_layer:skill_layer@postgres:5432/skill_layer_test
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6334
      OLLAMA_URL: http://ollama:11434
      GRAPH_BUILDER_PROJECT_ROOT: /skills/project
      GRAPH_BUILDER_GLOBAL_ROOT: /skills/global
      GRAPH_BUILDER_POLL_INTERVAL_MS: "5000"
    volumes:
      - test-project-skills:/skills/project:ro
      - test-global-skills:/skills/global:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  live-e2e-check:
    image: alpine:3.23.4
    depends_on:
      mcp-server:
        condition: service_healthy
      graph-builder:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        echo "==> mcp-server reachable"
        nc -z mcp-server 3001
        echo "==> graph-builder reachable"
        nc -z graph-builder 8080
        echo "==> live e2e topology ready"

volumes:
  ollama_data:
    external: true
  test-global-skills:
  test-transcripts:
  test-project-skills: